# API Gateway (nginx)
#  * единая точка входа: маршрутизация /api/<область>/... в нужный сервис
#  * X-Request-ID: генерируется здесь (если клиент не прислал) и пробрасывается во все сервисы
#  * rate limiting: общий лимит, строже на /login (защита от перебора паролей)
#  * структурированный JSON access-лог
#  * ошибки самого gateway (сервис упал, таймаут, лимит) — в том же JSON-формате, что и у сервисов
#  * /internal/* наружу не проброшен: эти endpoint'ы доступны только внутри docker-сети
# Аутентификация (проверка JWT) выполняется в каждом сервисе — см. libs/common/common/auth.py

worker_processes auto;
events { worker_connections 1024; }

http {
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json '{"timestamp":"$time_iso8601","service":"gateway","level":"INFO",'
        '"request_id":"$req_id","message":"$request_method $uri -> $status","method":"$request_method",'
        '"path":"$uri","status":$status,"duration_ms":"$request_time","upstream":"$upstream_addr",'
        '"client":"$remote_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    client_max_body_size 10m;
    # DNS docker-сети; valid=10s — чтобы после перезапуска контейнера gateway узнал его новый IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Key "";   # клиент не может подделать внутренний ключ
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Request-ID;      # сервис возвращает тот же ID — оставляем один заголовок
        add_header X-Request-ID $req_id always;

        error_page 429 = @rate_limited;
        error_page 502 503 = @unavailable;
        error_page 504 = @timeout;
        error_page 404 = @not_found;
        error_page 413 = @too_large;

        location @rate_limited { default_type application/json; return 429 '{"error":{"code":"rate_limited","message":"Слишком много запросов, попробуйте позже","request_id":"$req_id"}}'; }
        location @unavailable  { default_type application/json; return 503 '{"error":{"code":"service_unavailable","message":"Сервис временно недоступен","request_id":"$req_id"}}'; }
        location @timeout      { default_type application/json; return 504 '{"error":{"code":"upstream_timeout","message":"Сервис не ответил вовремя","request_id":"$req_id"}}'; }
        location @not_found    { default_type application/json; return 404 '{"error":{"code":"not_found","message":"Маршрут не найден","request_id":"$req_id"}}'; }
        location @too_large    { default_type application/json; return 413 '{"error":{"code":"payload_too_large","message":"Слишком большой запрос (максимум 10 МБ)","request_id":"$req_id"}}'; }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ---------- маршруты сервисов (добавляются по мере появления сервисов) ----------

        # ---------- Swagger UI сервисов ----------
        location = /docs  { return 301 /docs/; }
        location = /docs/ { root /usr/share/nginx/html; try_files /docs/index.html =404; }

        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Маршрут не найден","request_id":"$req_id"}}';
        }
    }
}
