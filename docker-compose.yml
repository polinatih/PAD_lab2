# Запуск:  copy .env.example .env  &&  docker compose up -d --build
# Снаружи доступен только gateway: http://localhost:8080 (веб-интерфейс), Swagger: http://localhost:8080/docs
# RabbitMQ UI: http://localhost:15672

name: food-delivery

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

x-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

services:
  # ======================= Инфраструктура =======================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      RESTAURANT_DB_PASSWORD: ${RESTAURANT_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # ======================= Микросервисы =======================
  auth-service:
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://auth:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ACCESS_TOKEN_TTL_MINUTES: 720
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  restaurant-service:
    build: { context: ., dockerfile: services/restaurant-service/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://restaurant:${RESTAURANT_DB_PASSWORD}@postgres:5432/restaurant_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://orders:${ORDER_DB_PASSWORD}@postgres:5432/order_db
      RESTAURANT_SERVICE_URL: http://restaurant-service:8000
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      restaurant-service: { condition: service_started }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  payment-service:
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://payment:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_db
      PAYMENT_TIMEOUT_MINUTES: 15
      MAX_ATTEMPTS: 3
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  delivery-service:
    build: { context: ., dockerfile: services/delivery-service/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://delivery:${DELIVERY_DB_PASSWORD}@postgres:5432/delivery_db
      AUTH_SERVICE_URL: http://auth-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      MAX_ACTIVE_PER_COURIER: 1
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://notification:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  review-service:
    build: { context: ., dockerfile: services/review-service/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://review:${REVIEW_DB_PASSWORD}@postgres:5432/review_db
      ORDER_SERVICE_URL: http://order-service:8000
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  # Одноразовый контейнер: наполняет систему демо-данными (рестораны, меню, тестовые аккаунты).
  # Повторный запуск ничего не дублирует.
  demo-seed:
    image: python:3.12-slim
    command: ["python", "/scripts/seed_demo.py", "--base", "http://gateway"]
    environment:
      PYTHONUNBUFFERED: "1"   # чтобы сообщения сразу были видны в docker compose logs
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      gateway: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      restaurant-service: { condition: service_healthy }
    restart: "no"

  # ======================= API Gateway =======================
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/docs-index.html:/usr/share/nginx/html/docs/index.html:ro
      - ./frontend:/usr/share/nginx/html/app:ro
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - payment-service
      - delivery-service
      - notification-service
      - review-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq:
