[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-common"
version = "1.0.0"
description = "Shared infrastructure code for lab2 microservices: logging, errors, health checks, auth, messaging, HTTP clients"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.14",
    "pydantic==2.14.4",
    "pydantic-settings==2.6.1",
    "uvicorn[standard]==0.32.1",
    "SQLAlchemy[asyncio]==2.0.58",
    "aio-pika==9.5.8",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
]

[tool.setuptools]
packages = ["common"]
